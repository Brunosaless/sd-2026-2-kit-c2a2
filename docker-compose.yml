services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ingestao:
    build:
      context: .
      dockerfile: servicos/ingestao/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CAMINHO_INDICE=/app/dados/indice.json
    volumes:
      - dados_indice:/app/dados
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: servicos/ingestao/Dockerfile
    command: python -m servicos.ingestao.worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - URL_INGESTAO=http://ingestao:8001
      - URL_RECUPERACAO=http://recuperacao:8002
      - CAMINHO_INDICE=/app/dados/indice.json
    volumes:
      - dados_indice:/app/dados
    depends_on:
      - redis
      - ingestao

  recuperacao:
    build:
      context: .
      dockerfile: servicos/recuperacao/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - URL_INGESTAO=http://ingestao:8001
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - ingestao
      - redis

  geracao:
    build:
      context: .
      dockerfile: servicos/geracao/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - URL_RECUPERACAO=http://recuperacao:8002
      - REDIS_URL=redis://redis:6379/0
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_URL=${LLM_API_URL:-https://api.openai.com/v1/chat/completions}
      - LLM_MODELO=${LLM_MODELO:-gpt-4o-mini}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-20}
      - LLM_RETENTATIVAS=${LLM_RETENTATIVAS:-3}
    depends_on:
      - recuperacao
      - redis


